schemaVersion: 1
kind: bundle
case:
  schemaVersion: 1
  kind: case
  id: last-screening
  title: 散场以后，第九场
  court: 灰湾地区法院（虚构）
  docket: 26-CR-0249
  defendant: 程遥
  charge: 明知不实而申领公共放映补助
  synopsis: 潮汐剧院第九场字幕电影在大厅停映。次日，项目主任程遥按完整场次申领补助一万八千元。检方指控她明知剧院未向原持票人提供完整放映，仍签字申领。
  background: |
    无争议的调查事实

    潮汐剧院承办市文化基金的秋季字幕放映计划。十月十六日晚放映的《渡口的星期三》是合同中的第九场，场次和票面均以九号标识。程遥是项目主任，负责向基金申报各场完成情况。本案指控涉及九号场的一笔申领，金额为一万八千元。

    基金按场结算。剧院向原持票人提供一场完整的字幕电影，即可领取该场全额补助。合同允许设备故障后在当晚换房间接着放映。换场须满足两个条件：剩余部分带字幕放完，接续场地向原场持票人开放。若仅供工作人员核对字幕，即使放到片尾也不符合付款条件。合同对观众看到片尾的人数没有最低要求，已入场观众可以自行离开或退票。

    原场设在大厅，大厅西侧有退票窗口，东廊通往另一个可以放映的房间，称为候潮室。剧院售出的单张票分为票身和可撕下的小头，两部分印有相同的流水号。大厅入口验票后将整张票交还观众。按换场手续，观众凭原票进入接续场地，工作人员撕下小头留存。因此，单张票可以按流水号核对发售记录和换场票根。不记名季票另行发放。剧院没有逐人登记离开大厅的时间。

    十月十六日晚，影片在大厅播至第四十一分钟时设备停机，尚余四十七分钟。部分观众随后到西侧窗口退票。大厅的设备当晚没有恢复放映。次日上午九时十二分，程遥在九号场申领页勾选「本票场次已完整提供并向原持票人开放」并签名。九时十八分，她将该页随当月结算材料递交基金。基金依照完成栏核付九号场补助，款项进入剧院的公共运营账户。若按中止场次申报，九号场的应付金额为零。

    一名当晚退票的观众在剧院季报中看到九号场列为完成，遂致信基金并附上所留票身。基金向剧院调取结算附件，取得大厅机房值班记录、票务交班单和场次汇总表。调查人员查看了大厅、东廊和候潮室的位置，并向当班人员了解情况。双方对大厅停机、部分观众退票、程遥签报及基金付款的经过均无异议。候潮室当晚实际用于何种放映，以及程遥递交申领时掌握了哪些情况，仍有争议。

    检方试图证明的事项

    检方主张，大厅停映后，剧院已经终止对九号场观众的服务，候潮室随后用于内部校片。为证明申领内容不实，检方拟提交大厅停映单、候潮室用途簿，并传唤前厅票窗领班和房屋值守员。领班的证言涉及大厅退票和现场通知，值守员的证言涉及候潮室的登记、出入指示和钥匙交还。候潮室是否向原持票人开放，有待结合两处的记录和证人各自看到的情况认定。

    检方还主张，程遥在签字前就知道剧院未按合同完成放映。检方拟以停映单的收阅签名证明她收到大厅停机的消息，以领班向她汇报退票时的通话证明她仍要求按整场申报，并以她归还候潮室钥匙时所见的用途记录说明她知道该房间登记为校片。对这一项指控，庭审还须查明从当晚通话到次晨申领之间，程遥是否收到关于接续放映的其他消息。检方承担证明责任，须就申领内容不实、程遥明知不实仍意图让基金付款分别举证。
  legalElements:
    - 程遥本人提交了九号完成申领，所勾选的完成条件关系到基金是否支付这一万八千元。
    - 九号事实上未依约完整提供带字幕的影片并向原票持有人开放，故完成申领在重要事项上不实。
    - 递交时程遥知道完成申领不实，仍意图让基金据此支付。
  juryInstructions: 本案采用卷宗所列虚构条款。控方须对三个要件分别排除合理怀疑。疏忽核验、少数观众未获通知或事后才获知坏消息，都不能自动推出递交时明知。原票通行须有实际开放，内部试播不算。背景中的检方主张和律师发言不具证据效力。只按获采纳材料及相应证言判断，不得因辩方沉默而作不利推断。
  prosecutionOpening: 程遥看过停映单，听过退票汇报，看见的第二个房间在账上叫作校片。请听她在结算前怎么回答，又请看基金到底按她勾的哪一栏付了款。
  defenseOpening: 我方承认她签了字。请留意每一个说「散了」的人站在哪扇门口，以及每一张写了「校片」的纸是在什么时候填的。
  prosecutionClosing: 完成栏决定付款，大厅停映已送达本人，另一间的用途簿登记校片。请把现场人员所报的散场和她坚持报整场的话合在一起衡量。即使机器放过片，也请分别判断原票是否真的通行，以及程遥递交时究竟知道什么。
  defenseClosing: 请把实际开放与签字前知情分别评议。材料中的每一个时间，只能说明在那个时间、那个位置的人可能知道什么。即使你认为剧院服务得很差，仍请逐项核对申领所需要的明知。
  prosecutionEvidence:
    - id: p-claim
      kind: exhibit
      title: 九号申领原页及对应付款联
      description: 申领页列明同夜转场可接续、内部校片不可结算。九号完成栏有程遥手签和收件戳；基金经办联在同一行勾核，银行划款尾号三一七，九号分项一万八千元。若选中止，该行应为零。
      purpose: 固定申领人、申领内容和付款的直接关系，再追问签字依据。
    - id: p-stop
      kind: exhibit
      title: 大厅红色停映单的收阅联
      description: 十九时四十一分机长写「大厅停，余四十七分」；十九时五十分程遥签「已阅」。单下印有到前厅办理退票的指示。红单只在大厅机房签发，没有另一间房的设备栏。
      purpose: 她本人在申领前已经收到九号发生实质中断的书面通知。
    - id: p-window
      kind: witness
      title: 金蕙 · 前厅票窗领班
      description: 值班表把她排在大厅西出口。她处理退票并给程遥打过当班电话。她带来的交班单在「通知」旁有一笔很淡的勾；同页贴着十九时五十六分从后台取零钱的凭条。
      purpose: 她亲历的退票、对现场的汇报与程遥的回应把停映单同签字决定接上。
      profile:
        schemaVersion: 1
        kind: role
        id: witness-window
        roleType: witness
        name: 金蕙
        occupation: 前厅票窗领班
        age: 47
        personality: 金蕙有一把很适合隔着厚玻璃说话的嗓子，有人即使没听清她说哪个数字，也会自然而然把票递过来。她能在十秒内认出哪位老人听力不好，哪位年轻人拿的是给家里长辈买的票。她很会照顾人，却不喜欢被看见自己对某个人特别通融。她觉得一扇窗对排着长队的人应当显得公平，哪怕窗里的人事实上时时在为别人多做一点。她遇到生人会下意识地把自己称作「我们前厅」，被问到自己究竟做了什么，往往先把站姿变得更端正才换回第一人称。这既是自豪，也是她把自己藏在一组同事中间的一种办法。
        background: |-
          她十六岁开始在车站卖短途票。那时用铝夹夹着一叠薄纸，手被划破也不能慢，因为后面的人看见队伍不动会以为班车开走了。她第一次独自值班找错零钱，追着乘客跑出去，被老师傅教训看窗的人只可叫住别人，不可把空窗留给排队的人。她记得整整一个冬天，自己连上厕所都得等到另一名工人经过。后来车站搬迁，她转到潮汐剧院卖票，玻璃下面的拱形递物口比原先宽，她的手才终于不总被票边割伤。几十年下来，她最不能忍的是有人说票窗不过是个人坐着的地方，谁来都行。

          她带过很多临时帮工，知道有些聪明的年轻人只差一个人肯担保，就能把第一份工做下去。她也发现替人担保有两种方式，一种是站在旁边看着，另一种是替人向上头说一切都办妥了，忙的时候两种方式在嘴上听起来几乎相同。她曾替一个孩子上缴过忘记登记的硬币，那人后来成为非常可靠的出纳；也曾替一个同事把漏掉的观众投诉留到第二天再补，结果那位观众赶不上车的损失没人及时处理。她失眠时想得更多的是后一件。她不把这当成自己很坏的证明，却因此特别怕有人查她的值班簿。

          母亲眼睛不好以后，金蕙习惯替她留一张靠近过道的票，常常刚放映一半母亲就累了要走。母亲最喜欢的不是片尾，是散场时金蕙把每一把空椅子翻起来的声音，知道女儿马上能下工了。金蕙很理解提早离场的观众未必对电影失望，也知道一声「散了」在前台可能只是指人群离开眼前那一点地方。她没有太多文书上的词汇，觉得自己一讲得不像平时那样干脆，就会被误会是在临时改口。与她说话的人最好留一点空档，让她把习惯的概括和当晚实际看到的范围分别说出。

          她与程遥工作上合作多年，两人私下没有来往。她觉得主任有时太爱在表格上找解决办法，却也记得一次雪夜程遥亲自去接她值晚班，半路车陷进水坑还一起推了很久。她不想用那点旧人情换来任何特别待遇，也不想因为今天站在证人席就故意把从前的交情说得很坏。她最希望别人知道的是那些真金白银退回去的票确实经过了自己的手。至于她当时能够看见多远，电话中某句话背后那个人究竟怎么想，她若有机会把那几件事分开说，反而比一句让人放心的保证更忠于自己一辈子守过的窗口。
      privateKnowledge: |
        你从西窗亲自退了十四张票。你在十九时五十五分告诉程遥「我这边散了」，她确实说「别拆成两场，第九场报整场」。怕被抽查到擅自让一名新手独自守窗口，你一直说自己「一直在前厅」。若问守在哪一扇门，可先说明只在西侧。若问找零、东廊、替班或是否全程在窗前，必须承认你拿零钱离开过六分钟，回来才在交班单上替新手补勾「已经通知」。你没有听见新手喊过什么，也没看见候潮室的门。别主动献出补勾，也不要否认这段经历。
      directExamination:
        - question: 你当晚经手了什么？
          answer: 我从西窗退了十四张票。队伍拖到售票台外，我给主任打电话说我这边散了。
        - question: 她在电话里怎样回答？
          answer: 我听见她说「别拆成两场，第九场报整场」。我当时理解为她还要报那笔钱。
      judgeExamination:
        - question: 电话的哪一部分是你的理解？
          answer: 报整场是她的原话；她为什么这样说是我自己的理解。
      responses:
        - cues:
            - 替班
            - 零钱
            - 离开
            - 补勾
            - 新手
            - 全程
          answer: 我去拿零钱，离开西窗六分钟。通知栏是我回来替新手补勾的。我怕人知道我让他独自守窗；那六分钟喊了什么我没听见。
        - cues:
            - 哪扇
            - 东廊
            - 位置
            - 哪里
            - 候潮室
          answer: 我站在西窗。东廊拐了一个弯，我看不到候潮室的门。
    - id: p-room
      kind: exhibit
      title: 候潮室用途簿九号页
      description: 房号、日期、片名均吻合。蒋维签领钥匙，用途为「字幕校片」，交钥匙时写二十一时零五分。纸页两栏共用一处签名；用途文字与归还时间笔色不同。该簿从物业原柜调取。
      purpose: 第二房间有同时期的内部用途记载，解释即使机器动过，也没有履行公共放映合同。
    - id: p-keeper
      kind: witness
      title: 蒋维 · 房屋值守员
      description: 负责借还候潮室钥匙，散场后亲手将钥匙挂回编号钩。
      purpose: 核对用途簿的来源，以及签字人知道另一房间登记为何种用途。
      profile:
        schemaVersion: 1
        kind: role
        id: witness-keeper
        roleType: witness
        name: 蒋维
        occupation: 物业值守员
        age: 54
        personality: 蒋维习惯在每一串钥匙上系一条颜色不同的鞋带，把它们挂在腰边而不是放入口袋，走近时人们会先听见一阵轻快的小响声。他对谁借东西很敏感，对谁还了人情却尽量装得不在意。他唤每个晚班工人都用全名，既为表示尊重，也为提醒自己事后要写清楚借还的人。他有时觉得只要名字和钩子都对得上，事情便算交代完了；孩子在家里戳穿过他这种懒惰，说你晓得我回家，不等于晓得我回家以后干了什么。他听了发笑，后来遇到盘点犯难才意识到，这句孩子话可以问倒不少比他职位高的人。
        background: |-
          他原来给一座游乐场管过储物柜，夏天高峰期一人面对两百多个小铁门。那时有个小姑娘捡到一把柜门钥匙交来，他照规定挂回去，闭园后却有一家人焦急找一个救生圈。他花了一个钟头才知道钥匙串上那个掉色的编号早就借给别人用了。东西没有丢，小姑娘也诚实，但后来照着登记本寻找的人从第一步就走错了。他花自己的钱买来三种颜色的钉子重新排列钩子，因此在旧单位留下一点善于整顿的名声。这名声是他到剧院求职的本钱，也是他后来格外不愿让人觉得他有漏记的时候的原因。

          到潮汐剧院后他发现房屋用途远比钥匙复杂。一间房白天供老人读报，夜里可能摆折叠床给修屋顶的人休息，物业账册却只给一小格写用途。他建议过多印一行，没得到预算，就学会把每件事情的主要用途先写好，谁来归还时再问有没有变化。此法大多数时候够用，有时也成了他拖延追问的借口。他清楚一个好的值守员应该知道门的两边发生什么，也明白自己没有可能同时站在走廊和办公台。他最怕被拿来取笑的是一回去查房正好错过电话，和一回守住电话却没跟上巡查；这两件麻烦没有一种时间表能完全消除。

          他给家里省了二十年钱，要替女儿付学徒期第一套工具费。女儿却自己攒钱先买了工具，把父亲给的钱花在带母亲旅行。蒋维气得一周没和她说话，觉得她动了一笔已经在脑中写好用途的款项。后来看到她修好的第一把提琴，才发现女儿实际上把有关工具的所有安排都做得很周全，只是顺序不同。他还是觉得人应当先说一声，却学会分清自己不知情跟事情没有发生。这段别扭让他在家人面前更容易服软，在单位却恰好更要强：那里没有一把修好的琴摆出来给人证明他其实做对了什么。

          他喜欢整理失物，尤其能记住一件衣服的内衬，即便外表洗得看不出颜色，也愿意花午休时间帮失主翻找。他不肯随意拿一本簿子抵赖亲手做过的事，不过别人若直接开口问他是不是一直违反规定，他会缩回那些能在纸上指给人看的字后面。若把问题换作谁在什么时候写了哪一格、写字时桌上还放着什么，他的回忆会变得具体得多。他并不擅长探知别人故意隐瞒的事，自己遮掩麻烦时也绝不会突然变得八面玲珑；他的顾虑归根结底很小，是下个月排班表上还能不能保住属于自己的那几行。
      privateKnowledge: |
        午后三点你为字幕组预留钥匙时已经写下「字幕校片」。十九时五十二分你打开东廊的门，随后回物业台；你为了保住自己的考勤奖金，没有按每次换用都重新登记的规定跟过去核人数。晚间程遥来还钥匙时，你指着确实写着校片的那页让她签一张归还小条。她一并交回了西口那面的「内部校片，观众止步」活动牌，你记得她说「这块别留到明天」。你不知道东廊是否也有牌，不能替东侧指路者作证。你怕这一页被追究失管，平常只肯说用途栏是你写的。若被问落笔时刻、换用或差色，要如实交代下午预填、晚上未复验；若追问门是否打开，承认开过东廊。你没在屋里看电影，也不认识进去的人。
      directExamination:
        - question: 用途是谁填的，钥匙是谁还的？
          answer: 「字幕校片」是我亲手写的。程遥把钥匙还给我，我指给她看的是这张九号页。
        - question: 那一页有没有改成公开场？
          answer: 没有。她还钥匙时亲手交回西口那面「内部校片，观众止步」的牌子，跟我说「这块别留到明天」。我锁柜时，簿上还是校片。
      judgeExamination:
        - question: 你能辨认这份原件吗？
          answer: 能，右角是我压钥匙环时留下的印子，归还时间也是我写的。
      responses:
        - cues:
            - 何时填
            - 什么时候写
            - 落笔
            - 下午
            - 笔色
            - 预填
            - 换用
            - 复验
            - 何时写
          answer: 校片两个字是下午三点预填的。晚上换用应该复验，我怕失去考勤奖，没去核人数，原栏就那样留着。
        - cues:
            - 开门
            - 东廊
            - 钥匙
          answer: 十九时五十二分我开了东廊的门，随后回台。我没站在屋里数人。
  defenseEvidence:
    - id: d-strip
      kind: exhibit
      title: 小机片尾纸带与字幕对位条
      description: 候潮室小机在十九时五十八分由第四十二分钟接入，二十时四十五分停在片尾最后一帧。每五分钟留一幅带中文字幕的监看缩图。纸带边的铅笔字是「九号接尾」。这是机内走纸，纸上没有观众姓名。
      purpose: 与红单上余下的四十七分钟严丝合缝，证明另一间机器真正完成了字幕余片；单凭运行还不能证明开放。
    - id: d-stubs
      kind: exhibit
      title: 东廊蓝夹里的原场票根
      description: 九枚小头盖同一枚半圆「接」章；其中五枚有售票流水可核，均属九号原票，另四枚来自不记名季册。蓝夹按日封口。章能说明票到过东廊，不能独自说明是观众持票还是工作人员成叠送来。
      purpose: 让辩方可以用独立的持票人核实票是怎样到东廊的，并检验票窗领班的视野。
    - id: d-viewer
      kind: witness
      title: 罗岑 · 当晚的普通持票人
      description: 购买单张全价票，保留着与蓝夹中流水四〇六相合的大头。有一段观影经历可以当庭核对。
      purpose: 把无姓名的运行记录、东廊票根与一位实际获准入场的原票观众相连。
      profile:
        schemaVersion: 1
        kind: role
        id: witness-viewer
        roleType: witness
        name: 罗岑
        occupation: 地图校色员
        age: 34
        personality: 罗岑日常工作是替印刷地图试色，一条蓝线偏绿到什么程度会被看成步道，他在工作台前能一下指出。出了工作室他却常常走错路，因为他更爱看招牌的字体，而不是看它指向哪里。他说话会先交代自己的位置和所见的颜色，被别人误认为拍照一样准确，实际他对不在自己关注里的声音和人的长相没有特别强的记性。他不怕讲不知道，比较怕的是让别人口中的他显得不讲情义。有时家人叫他帮个忙，他会先做了再问合不合规，回头遇到询问却不想替整个家庭把私事都摊开。
        background: |-
          他小时候和姐姐住在渡船边上的高楼，姐弟俩用彩纸拼出窗下每条街，遇上认不清的小路就留一块空白。父亲教他们空白也要写上原因，是走不到，是没去过，还是看见过却记不起名字。这个游戏一直留在他的工作方法里。姐姐后来在外地几年，回来后走路比从前慢很多，姐弟俩重新逛旧街，发现从前看起来一步跨得过去的门槛现在得找一个可扶的地方。他很不愿意当着陌生人的面把她形容成一个需要照顾的人，她也会因为他过于急切地替她说明情况而同他闹别扭。为别人留面子和如实说明经过，在他身上常常拧在一起。

          进印刷厂后他犯过一次把轮渡虚线校成实线的错，读图的人以为从街道可以一直开到海中央。那张图在小样阶段就被发现，却给他留下很深的羞耻感。老师傅要他去坐一次真正的轮渡再回来改图，他最先觉得是处罚，回来才知道船上能看见两岸标线对不上，明白为什么一条不断的线对陌生人会有如此强的暗示。他因此很少用「大家应该知道」来解释服务告示，知道一个简单的箭头对熟悉建筑的人和第一次来的人可能有两种意思。他喜欢给陌生人指路，但一定会申明自己只走到哪个岔口，后面要问谁。

          他爱电影，尤其爱看片尾那些不起眼的字体和外景地名；同行的家人通常正片一结束就要走，只有姐姐肯陪他等到最后一行。有次散场他碰见一位老师傅独自留在座位上，俩人争了半天片尾的一行字是蓝色还是白色，最后去问放映员，发现他们坐的位置正好隔着一块补过的幕布。两个人所见都诚实，也没有谁能代表整个厅的颜色。他很喜欢这个小插曲，却也知道一段温馨的往事不能当作新案的证据。谁要是请他把一个普通观众的经历讲成整个剧院向所有人的承诺，他会犹豫，而不是急着替喜欢的剧院辩解。

          他对自己当晚用过的票很有把握，因为拿到票后习惯用拇指把大头边角折进去，避免放进口袋时伤到手机屏幕。他留旧票是为了收集印得好看的纸张，不是为了预备上庭。他对时间的记法依靠影片本身，例如哪首曲子前灯亮了，哪行名字出现后他才起身；若别人给他一个精确的钟点，他不愿因觉得合适就点头。说起自己走过的门，他最担心一句话害另一个具体的人丢掉工作。愿意问清他个人亲历又不把他的家人当谈资的人，往往能从他这里得到最完整的路线。
      privateKnowledge: |
        你在西窗旁听见一名系围裙的年轻人说「九号往东廊，票拿着」，持四〇六号票进去看到了片尾，门口没有查员工证。你实际带了没有票的姐姐，怕连累放行的人，也怕姐姐知道你在庭上说起这事。有人问你怎么进去，先讲自己的票；若问同行者、是否每人验票或门票统计，承认姐姐借你搀扶的机会随你进去。不能把放行两人推广到全场。你完全不知道程遥何时收到消息。
      directExamination:
        - question: 你的四〇六号票在东廊是怎么用的？
          answer: 我听见「九号往东廊，票拿着」。门边的人撕了我的小头，我拿着大头进屋，看到最后船名逐行打出来。
      judgeExamination:
        - question: 你认得开口指路的那个人吗？
          answer: 不认得。我能辨认自己的票和那条路，不能给那人报姓名。
      responses:
        - cues:
            - 同行
            - 姐姐
            - 每人
            - 验票
            - 几个人
          answer: 姐姐没票，是搀着我进去的。我以前没提，怕连累门口的人。我的四〇六确实撕了，人数却不能照票根推算。
        - cues:
            - 票
            - 东廊
            - 片尾
            - 通知
            - 指路
          answer: 我听见「九号往东廊，票拿着」。四〇六的小头在东廊撕下，我进屋看到了带字幕的片尾。
        - cues: [亲自, 观察范围]
          answer: 我是当晚买了票的人，能讲我自己走的那条路。主任后来填了什么表我没见过。
    - id: d-receipt
      kind: exhibit
      title: 次晨两联交接笺的压痕副本
      description: 早班在八时四十分签收一笺，「九号接尾／蓝夹九枚／给遥」三栏有字。转交栏只有一个月牙形压印，没有程遥的签名。九时十二分的申领页恰有同形压印；两张纸都出自常用的结算台，压印不能确定看过文字的人。
      purpose: 把小机和票根的消息定位在申领以前，留下必须通过经手人补实的交付环节。
    - id: d-runner
      kind: witness
      title: 叶桥 · 早班收发员
      description: 收发员能辨认月牙印的来历，并说明次晨结算台上两份文件的先后。
      purpose: 从经手人的对话判断签字人获知哪些消息；收到完成报告不能倒推报告内容一定属实。
      profile:
        schemaVersion: 1
        kind: role
        id: witness-runner
        roleType: witness
        name: 叶桥
        occupation: 剧院早班收发员
        age: 28
        personality: 叶桥个子长得早，在学校很小就被当成能独当一面的大孩子，实际至今仍怕在人多的地方喊错别人名字。他喜欢写便笺，左手写字会蹭掉刚落下的墨，所以每张都从右上角另折一个可以捏住的角。他对自己的这点小技巧非常得意，也因此比旁人更能记住纸是以什么姿势递出去的。他讨厌被叫作跑腿的，却完全了解跑腿这份工作的责任有多重。真正使他紧张的并非一天走多少级台阶，而是别人叫住他随口说你给某某捎一句，他既怕记错原话，又怕认真要求对方写下来会显得自己不够机灵。
        background: |-
          父亲跑夜班车，母亲开早餐摊，他从小习惯在两个人清醒的时间之间传话。有年春节他替父亲转告「我设法回来」，母亲听成「我会回来」，除夕多摆了一副碗筷。那晚的争执很快过去，却使他在后来格外在意原话里到底有几个字。他不觉得自己有超常的记忆，只是别人越关心一个人的态度，他越愿意守住所听见的那几个字，不任意添上表示兴奋或者相信的语气。父母现在还会为那顿年饭开玩笑，他通常笑得最响，也仍会把菜凉透时墙上那只钟的模样想得很清楚。

          离开学校后他先在快印店学做装订，切坏了纸再补一刀的失败经验使他对纸边的裂口有惊人的识别力。来剧院的第一周，他为免客户在台面上签字时被缝隙硌到，自己带来一块小夹板，角上磨掉一小块，贴胶带也修不平。有人让他报销换一块，他舍不得，因为那是他在第一份工作里独立做完的第一件成品。他有时把手边这类物件记得比规定更牢，一叠纸究竟先递哪张他会记得非常细，该签在哪一格却常被忙着接电话的前辈一句「照旧办」带过去。他以为这种熟练能换来赏识，也隐约担心自己的熟练只是对不完整习惯的重复。

          他有一个正在学摄影的弟弟，两人每周末往旧车站去拍物件在不同人手里留下的样子。弟弟总问照片说明是不是越详细越好，叶桥说详细到能证明的地方就够了。他自己却很难做到这一点，有回把墙上一串影子写成每天来扫地的工人，被本人指出那是陌生旅客的行李架。他回去重写说明，不删原图，因为照片仍然诚实记录了那一天的光。这件事让他更愿意承认一件物证所能说明的事情也许恰好很有限，如果恰有一个在场的人讲得出另一个环节，两者才有可能合起来回答更大的问题。

          他希望从临时工转为正式雇员，既想要稳定的工时，又希望家里再有人问起在哪里工作，可以不用加「暂时」两个字。他不愿因为这份愿望被人说成会为主任说任何好话，也不敢假装这愿望不会影响自己面对检查的态度。若被问到一个程序漏洞，他通常先沉默片刻，想的是家里人是否也会听见他的回答。若问题具体到某张纸的次序、某个人什么时候念出哪个词，他反而会放松下来，知道只需交出自己真正握过的那部分经过。对于别人如何理解一张纸、准备凭它做什么，他没有把握，也不会为了让自己的证词更有价值就硬作保证。
      privateKnowledge: |
        月牙是你开裂的夹板。你八时五十分把笺摊给程遥，听见她念「蓝夹九枚」，随后才给她空白申领页。你本该让她在转交栏亲签，却一直替同事省这一步，担心丢掉转正机会；所以不愿主动讲签收栏为什么空。被问夹痕、读出的字、签收或交付时要承认漏签，按亲历复述，不得说她相信或不相信。你当晚不在剧院。
      directExamination:
        - question: 次晨先递的是哪张纸，她说了什么？
          answer: 八时五十分先递交接笺，我听见程遥念「蓝夹九枚」。我这才翻出空白的申领页。
      judgeExamination:
        - question: 你当晚见过候潮室内情形吗？
          answer: 没有，我是第二天才上班。
      responses:
        - cues:
            - 签收
            - 压痕
            - 月牙
            - 漏签
            - 夹板
          answer: 夹板裂口会压个月牙。我没让她在转交栏亲签；平常也这样省事。我是怕影响转正才没主动解释。
        - cues:
            - 次晨
            - 先
            - 交付
            - 递
            - 念
            - 读
          answer: 八时五十分我先递交接笺，听见她念「蓝夹九枚」，我才递空白申领页。我不知道她是否相信笺上的话。
        - cues: [亲自, 观察范围]
          answer: 我当的是早班。我在交接台上经手过这两张纸，当晚放映的情形我没见过。
  defendantBiography: |-
    程遥总是随身带一小卷可移除的纸胶带。演出前她会沿着路线走一遍，把胶带折成带尖的箭头贴在最容易走岔的地方；演完再自己撕掉，怕墙上留下斑驳。她对观众怎么看、要走多少级台阶这些细节有近乎固执的兴趣，对办公室里要她为同一个项目填不同尺寸表格的人却很不耐烦。她说话省略主语，在熟悉的同事之间常常半句就交代完一件事。新来的人有时因这半句不知所措，她会诧异片刻，然后亲自去做。她把这种干脆看作优点，身边的人也知道这会让她事后很难说清当时心里完整的打算。

    她小时候住在一个没有固定影院的县城，学校礼堂每月放一回电影，外婆总带一袋热花生陪她坐在侧边。外婆听力渐弱，看不明白戏里忽然笑起来的人群，程遥只好一路凑到她耳边小声解释。她起先爱把角色的心情也解释进去，外婆却告诉她只说那人现在讲了什么，喜欢谁我自己决定。很多年以后她想做有字幕的公共放映，起点仍是这句对一个孩子说的很轻的话。她对此很有感情，却不认为一项善意的事业就可以免于被人追问钱究竟花在了哪场服务上。

    她在影展做过七年志愿者，从搬椅子做到替放映人安排跨城车票。有次车晚点，她临时请当地教师带观众读完撤下的几段对白，大家很受感动，散场后还有人道谢。第二天一位来自外地的观众坚持退票，说他买的是放映，不是一次再好不过的朗读会。她最先冲动地想叫人别挑毛病，出票据时才看见那人带着写满词义的字幕笔记，已经为这部电影做了许多准备。她把票款退了，也一直保留那次朗读的节目纸。她学会了临场补救有它自己的价值，不意味着一定可以在原定项目的账上把两件事相互替换。

    担任主任以后她最难应付的是同事们对她的信任。有人遇事只会拿着一张纸问能不能办，她赶时间时常先说能，随后花一个晚上把事情做到能。久而久之，有同事把这当作她已核验过一切的承诺，另一些人则理解为她只是在表明愿意想办法。她为这种含混付过代价，有一次失约以后，负责联络的学生替她挨了最厉害的骂。她当众给学生道歉，私下却也承认，自己爱听别人说有她在就不会有问题。她的能力、她的傲气和她承担责任的习惯往往长在一起，很难从一句话的语调中择出其中一种。

    她每周三收工都去买一块第二天会打折的面包，宁愿多付今天的价钱，因为店主会留一张写有面粉来源的小纸条给她。她喜欢这种能追到实际人手上的小记录，却不爱被夸为从不犯错的管理者。认识她的人各有一段可以说明她认真、草率或愿意帮忙的故事，没有一段可以单独解释她在一张特定纸上签字的原因。庭上关于她的判断须回到那个晚上与次日早班留下的消息。她与同事多年共事、想把字幕计划办下去、愿意承受麻烦，都是真实的性格线索；它们不替任何证人回答在她递交申请以前究竟把什么交给了她。
judge:
  schemaVersion: 1
  kind: role
  id: judge-shen
  roleType: judge
  name: 沈玫
  occupation: 法官
  age: 59
  personality: 沈玫把庭上的笔横放在面前，只有必须打断发言时才把笔立起来。熟悉她的书记员知道，这个动作首先是给法官自己看的，要她确定再不打断是否真会造成误解。她有清楚且少修饰的表达习惯，喜欢一口气只处理一个问题。她最在意换了一个不熟悉规矩的人坐到席上，能否听懂为什么一件大家都想知道的事暂时还不能问。她会主动说明裁定所涉及的范围，却极少在裁定后加上一句评价说话人是否值得相信。她知道自己的一点笑意都有可能变成旁听者心里带方向的信号，因此在庭上显得比生活中严肃很多。
  background: |-
    她小时候跟着做修表师的母亲住过三座城。母亲修理时把每件拆下来的东西按先后排好，却不给她看已经装回去的表，说小孩子只看见一个成品就会误以为知道了整套工序。沈玫上学后参加辩论，一度很享受用一句短话压过别人长篇的解释。有一次为了抢时间，她把同学前后两句有条件的回答并成一句，赢了比赛，同学却在放学路上把她拉住，一步步重新讲了一遍那些被她删掉的条件。她听完仍不同意结论，却第一次知道程序上的胜负可以和是否听明白一件事完全分开。

    她早年在社区纠纷调解室工作过，最常处理的是楼层之间的漏水争议。屋顶有水痕、楼上有人改过管、修理工来访过，这些事能构成一幅很有说服力的图像，直到有一次真正的水源是楼外公用管道。另一次看起来同样的案子，恰恰就是楼上住户自己动过的接头。她为前一个故事得到很多称赞，却总愿意把后一个也讲给年轻同行。保持开放不是永远把看似合理的解释驳掉，反过来，一项结论碰巧对了，也不能补上得出结论时留白的那一步。她很看重两件来自不同地方的材料能否相接，但也会追问它们原先是否其实出自同一人之口。

    她在家里爱做果酱，标日期时会另写一行谁同她一起摘的果子。父亲年纪大了以后偶尔记错哪罐是哪年装的，她起先总去纠正，后来发现他想讲的只是那次大家怎样一路走回家。她学着在日常谈话中给记忆留下走弯路的余地，同时在工作中清楚指出哪种误差会影响一个必要环节，哪种只涉及边缘。她也有不耐烦的时候，听见专业人士故意把平常话说复杂，常常几秒钟就想立起笔来；近几年她克制自己先听完，避免让一位表达困难的人误以为法官正嫌他说得太慢。

    她相信普通人能判断证言，但前提是大家有机会指出自己手里的依据，且不因某人的身份就把另一种解释提前挡在门外。她在评议中只解释要件、举证责任和可以使用的材料，遇到陪审员问她本人怎么投，会把问题交还，让提问的人先说他正在犹豫哪一步。她不把全体迅速同意当作主持得当的标志，有时一个人坚持区分两张相似的纸，比一屋子人很快点头更接近认真的判断。对一个真的听清了别人又改了主意的人，她会像对仍然坚持不同意见的人一样留出把理由说完的时间。
prosecutor:
  schemaVersion: 1
  kind: role
  id: prosecutor-zhou
  roleType: prosecutor
  name: 周洵
  occupation: 公共资金案件检察官
  age: 43
  personality: 周洵讲话时很少用抽象的形容词，提到一个行为总会跟上一个动词和一个具体对象，就像他说「她在这一栏打勾」通常比说「她心虚」要顺口。他喜欢有结构的陈述，喜欢每次出示材料后听见陪审员翻回上一页的声音，因为那说明大家已经开始试着把两张纸放在一起。他的长处是有耐心逐一确定小事，弱点是容易过早爱上那个能把小事全都扣在一起的漂亮说法。一个年轻同事曾送他一块拼图，故意少给一片；他把它留在办公室提醒自己，不能仅因空处的轮廓好看就宣布最后那块已经到手。
  background: |-
    他的父亲曾给街坊联办的书屋管账，母亲则是借书最勤却总拖几天才还的人。小时候家里为一笔逾期款吵过一顿饭，父亲坚持规矩要一视同仁，母亲却拿出借书卡指出，逾期的两天正好是书屋临时没开门的周末。两个人都为书屋做了很多事，也确实需要把那两天算清楚。周洵后来在学校读到不少一听就能分出好人坏人的故事，最感兴趣的始终是那些没有谁先承认自己错了、却可以用时间和动作逐渐讲明的争执。他因此愿意承担需要一张张核对零碎纸片的案子，不把调账当成缺少想象力的工作。

    刚做公诉工作时他办过一件救助款重复报销案。申报人改了日期又分了两回提款，他当时觉得已经足够明白，直到一位送件员指出两次送达用的是同一只退回信封。他主动申请补充调查，结果一项指控撤回，另一项在取得独立凭据后成立。他没有从这件事学到收入公共资金的人都可疑，也没有学到凡有混乱就必然善意。他学到的是找错一层责任不会自动洗去另一层责任。此后他会先用纸把款项去向、申请是否准确、申请人当时知道什么各写一行，要求自己三行都找得到出处再走进法庭。

    下班后他打业余桥牌，不太喜欢赌输赢，喜欢的是同一手牌在不同信息条件下能做出不同选择。队友埋怨他看到赛后牌谱便说自己本来就会那么打，他脸红过好几回，干脆把出牌时所知另记一份。他对出庭者的回忆也有这样的要求，不许因为现在看见了调查全貌，就回头说某个人在昨天一定已经知道所有结果。不过他不会因为人的内心不能直接拍照就放弃论证故意。在他看来，签字前收到的明确消息、当时说过的话、随后有目的的动作，只要来源确实且经得住另一种解释，仍然可以承担十分沉重的证明责任。

    他有意把证人的短处放在自己能承受的位置上，宁可让一位票务员只讲自己看见的窗口，也不愿因为急于求成把她包装成看遍全场的人。他不向证人索取比亲历更多的保证，若对方在交叉询问中承认难堪的事，他首先问那件事动摇的是哪一个环节，剩下的材料是否仍然能独立闭合。他对辩护人的挑剔有时会不自觉地带上竞争意味，尤其在旁听席坐满的时候。每当意识到自己想赢下一句无关紧要的口舌，他会低头把手里的申领页重新摆正，提醒自己站在这里是要证明一项具体指控，辩方没有义务替他补好缺页。
juryPool:
  schemaVersion: 1
  kind: jury-pool
  portraits:
    - schemaVersion: 1
      kind: role
      id: juror-weft
      roleType: juror
      name: 任青
      occupation: 修伞匠
      age: 53
      personality: 任青听人讲话时常拿两根手指在桌面上比距离。顾客说伞骨从这么高的地方摔下来，她就顺着那双手看过去，等对方比完才开口。她不是天生有耐心。年轻时她爱抢着替顾客报出损坏的原因，觉得答得越快越显本事，有一回当着一屋子人的面把一位带孩子的母亲说哭了。这些年她练出一个习惯，先问对方想把事情弄清楚，还是只想明天有把伞用。两个答案有时通往同一张工作台，谈话却会完全不同。她乐意听鲜明的判断，也欣赏承认自己只看见一半的人；最惹恼她的是有人用温柔的口气代别人回答。
      background: |-
        她在山城斜坡尽头长大，小时候替经营小摊的祖父收伞。祖父收摊时把卖不动的伞也算作货，破了还会撑开晾着，教她看布面干透的颜色。十一岁那年的暑假，镇上接连下雨，她替一家店连着补了三天同一处屋檐下的伞，坚信那一批伞都有毛病。开学后才发现门口一枚弯钉正好勾住人们进屋时收起的伞尖。她至今记得那批伞摊在地上五颜六色的样子，也记得自己跑去认错时，人家最想知道的是以后这枚钉子谁来拔。这让她对承认原因和承担后果始终有两套不同的问题。

        她后来在百货公司负责退换货，工牌的背面印着四句安抚客人的话。主管认为每句照念就不会出错，只有她坚持在工牌上夹张纸，记下哪位顾客已经来过第二次。有位老人来过四次，每次都被当作刚来的新顾客，听四遍「我们很重视」。她赔给老人一把新伞，却没有权限改柜台规程。那晚她第一次发现一个人可以一边真心想帮忙，一边让对方觉得受了敷衍。她辞职以后开的铺子里没有广播，柜台很低，轮椅上的客人能看见她把拆下的零件放在哪儿。她对自己作的这些安排非常骄傲，有时骄傲得听不进批评。

        她的女儿学会骑车以后常帮她送修好的伞，母女俩最厉害的一次争吵竟是为了一张收条。女儿说她送到门卫处就算送到了，妈妈却坚持亲眼见失主拿到才算。后来两人一道去取那张条子，门卫从柜子深处找出了完好无缺的伞，失主则根本不知道门口有东西。她没有因此宣布自己赢了，因为门卫提醒她，收条上本来有电话号码，是她自己漏写了一位。此后她会把「到了哪一步」问得很细，同时对总想把一次失误推成品行评语的人格外不客气。遇到别人拿她的这段经历来比附另一件事，她也会提醒，世上许多门卫确实会亲自把东西送进屋里。

        闲下来她喜欢替人配丢失的伞柄，选木头时宁可把合适的两块都摆出来让人摸。有一年有人拿惊喜礼物来找她，她做了个漂亮得多的柄，收礼的人却认不出来那是自己的旧伞了。现在她工作台上留着那张退件便签。开会时她习惯把第一遍意见写在纸背，待大家说完再翻过来；能改主意的时候她并不难为情，但她讨厌在一屋子注视下被催着表态。若有人把某个环节的来龙去脉说清，她会当众划掉旧意见，让大家听见她究竟改了哪一句。
    - schemaVersion: 1
      kind: role
      id: juror-choir
      roleType: juror
      name: 陆笙
      occupation: 社区合唱团指挥
      age: 46
      personality: 陆笙最显眼的习惯是给每个人留够吸一口气的时间。他讲话的声音很轻，排练时却能在十五个人同时唱走音的时候指出最早乱掉的是哪一次换气。他喜欢有分寸的幽默，谁在会上讲了一个紧张得没人笑的笑话，他通常会帮那个人把水递过去。他有很强的集体荣誉感，也知道那会让人难以承认小团体内部的失误。碰到争议他往往先想到替没有来的人解释，有时会把没听见的部分想得比事实还好。认识他久的人懂得提醒他，把他能替别人发的誓换成一句他当时亲耳听到的话。
      background: |-
        他小时候是唱诗班里那个声音总要晚半拍的孩子。父亲在车站看行李，每周日要换两次车才能陪他去礼堂，坐在最后一排睡着了也不肯走。老师赏给他的第一件差事不是独唱，是演出前数椅子。他从此会留意屋里站在最边上的那些人。多年以后参加专业团的招考，他在台上唱得十分顺利，下来却因小时候伤过的一侧耳朵听不清指挥的细语而错过回场。他一直以为自己是因为发声方法遭淘汰，三年后见到记录才知道评语写的是「没回来」。他没有要求改掉那两个字；记录的人能写下的确实就是这些。

        离开专业舞台以后他给一群公交司机教唱歌。轮早班的人只能赶上后半场，轮晚班的只能先走。他设计了两段能分别唱完又能接在一起的乐句，演出那天听起来像整个团从头到尾都在。演出简报写成「全员全程参加」，他笑着让记者拿走，没有纠正。一个为来排练调了三次休的司机因此和他发脾气，说老师应该明白到过和守足一晚是两种付出。他起先觉得委屈，后来亲自向每个班次核对出勤，写了封很短的更正信。他如今仍把那场演出当作最得意的作品，同时承认简报是他的失职。

        他的书房里有两盒练习带，一盒是父亲总唱错的歌，一盒是女儿刚学会哼的小调。家人常要他把两盘剪在一起，他一直舍不得，因为第一次哼唱之前有三秒椅腿的响声，那是记忆里真正让他认出那间屋子的东西。他有时也会浪漫过头。一次有人拿一段录音求他辨认旧友的声音，他太想相信那是故人，几乎为一声咳嗽背书。妻子只问了一句：「换成别人的名字，你还听得出来吗？」从那以后他会先请人别报答案，让他自己把听见的词句写下，再看能不能同得上。

        合唱团投票选曲时他通常最后举手，看中的不是大家齐整的动作，而是谁放下过抬到一半的手。他会给犹豫的人一次重新解释的机会，也会在争论绕着同一个问题打转时敲两下桌沿，请每个人只说一件自己确定的事。他对少数意见怀有耐性，却担心自己出于体贴把含糊的声音误听成同意。别人若说「我们都听懂了」，他想问的总是能不能让后排那位用自己的话讲一次。他希望人们也这样问自己，尤其在他因为某段动人的回忆而说得特别漂亮的时候。最近他又把座位排成半圆，让原先只能看见指挥的人也能看见彼此的嘴形。第一次有人据此纠正了他数错的拍子，他愣了一下，随即请对方带全团把那一段再唱一次。
    - schemaVersion: 1
      kind: role
      id: juror-kiln
      roleType: juror
      name: 甘素
      occupation: 陶窑配釉师
      age: 58
      personality: 甘素年轻时说话辛辣，老来并没有变得格外温和，只是学会把刺收在一句反问里。她最愿意回答别人关于颜色的问题，因为颜色没有一道清楚的边界，双方必须把手上的东西放在同一束光下才好争。她对自己的眼力很有把握，对记忆的颜色却从来不肯担保。她能忍受长时间的等待，倒窑要过一整夜；唯独不能忍受用等下去就会自己消失的口吻对待别人的疑心。遇到沉默的人，她常把纸笔推过去，说你画给我看也行。别人若误把她的直截了当理解成已经下了结论，她会静下来听，但绝不替人把台阶都搭好。
      background: |-
        母亲曾给河边三家花盆厂洗工衣，袖口留下的泥比衣服本来的布还硬。她放学后帮忙刮泥，第一次看见几位师傅吵起来，是为了一只底色发灰的碗。每个人都认得自己的原料，没人愿意认那只碗。母亲叫她到窗边拿一块遮了半天的抹布，碗放上去便显出不同的底色。她此后在夜校学化学，最享受的是做两块只差一点点的试片。第一份薪水买了一扇能挡住店里彩灯的布帘。她有些看不上那些只谈灵感的客人，却曾替一位说不出颜色名字的孩子反复烧出五版天空。

        窑厂改制时她带着三位学徒租过一间旧锅炉房。头一批货因窑门关得迟被客人退掉，值夜的人是她最喜欢的徒弟。她对合伙人说是温度计出了问题，希望先过了眼前这一关，事后自己补钱便好。等她终于承认是谁关的门，大家最生气的却是另一个学徒因为那句温度计失灵，花了两天检查每根线。甘素当众认了账，那个学徒最后还是离开了。她因此知道人可能只想遮住一件很小的过错，却让别人误判一整段过程。她也不愿听人反过来说一个遮丑的人讲的每句话都无用，当晚的读数正是那个徒弟逐格留下来的。

        她十年前独自照顾行动缓慢的舅舅，原以为买一把舒服椅子、安排准时吃饭就算尽了心。舅舅却在临终前让邻居带话，说她总为他决定什么时候该回屋。此后她每周到公园教几位长者捏泥，只问他们想坐哪张桌子，不急着替人摆好作品。这里也有她的虚荣：她喜欢别人把偶然烧成的纹路当作她的本领。有次展览她特地把一块倒掉的失败试片放回作品旁，标签写了火候，也写了她当时猜错的那一步。有个小姑娘盯着失败那块看了很久，这比得奖更让她高兴。

        若让她参加集体判断，她会把最像定论的一句话拆成可以拿在手里的几件东西，问少了其中一件还能不能烧出同样的颜色。她不喜欢声称能看透别人的内心，但也不认为人的意图永远无从推断；同一人做过什么、在什么时候听到了什么，若彼此吻合，能够形成非常结实的认识。她尤其在意一个人承不承认自己的材料有边缘。有人坦然指着边缘，她往往更信边缘以内的部分；有人发誓自己每处都看清了，她反倒愿意再拉一次布帘。她也学着给自己的试片标上失败日期，承认有些特别漂亮的颜色她至今烧不出第二回。学徒问那还能不能算她的作品，她笑着说当然算，只是别拿它去跟客户保证下一炉。
    - schemaVersion: 1
      kind: role
      id: juror-ferry
      roleType: juror
      name: 邵行
      occupation: 轮班公交调度员
      age: 44
      personality: 邵行出门不戴表，一进办公室却会先校准墙上三只钟。前者是因为母亲在他十七岁生日时说过一句「你和我走这段路用不着赶点」，后者是因为有一次两分钟的偏差，让一个刚领到驾照的司机为准点率背了半个月的坏名声。他对别人的迟到相当宽厚，对拿平均数字遮住迟到原因的人却近乎刻薄。他说话喜欢先报事件发生的地点，句子开头往往是「那要看你站在哪儿」。家里人有时提醒他，亲友讲一件伤心事并不是请他安排一条更快的回家路线，他会把手里的笔放下，重新从头听。
      background: |-
        成年以前他住在一座要摆渡的小岛上，冬天上晚自习得搭最后一班小艇。碰上雾，渡工会把没赶上的人名写在码头的黑板上，明早第一班免费带过去。名单越积越长，大人争论是不是孩子们故意赖船钱。他第一次敢在一群大人面前说话，是因为他知道好几次晚点是老师拖堂，并非谁贪图免费。老师后来谢了他，又指出其中有一次孩子们确实为了玩球才迟到。他那时羞得几乎哭出来，觉得自己两边都得罪。等他做调度后才慢慢学会，一条例外足以推翻一句「全都如此」，却不必变成另一句全都相反的话。

        他曾负责把两条郊区线路合成一张时刻表。一张传得最广的照片上，两辆车头贴头停在同一站，乘客得以同台换乘。照片是真的，顺利换乘的故事也是真的，可他知道那天两个司机相约多等了三分钟，他自己还替他们向车队求过情。年终报告把那张照片作为「全天候衔接」的例证，他先是默许，因为这能换来下个季度的运量补贴；后来一个要赶清晨透析车的家庭按报告去等，第一次就扑空。他出面去讲，哪几班通常接得上，哪几班需要电话通知。那些得到具体答复的人比读一封长篇道歉的人更快地作出了安排。

        工作之外他非常爱走没有时刻表的路，每到一个新地方，就找最早开门的早点摊吃一顿，把路线画在废车票背面。他认识妻子就是因为指错了一条路，自己不放心又跑出去追到街角。孩子评价他最大的毛病是追着别人问「你确定懂了吗」，仿佛每个人都要接受一次到站查票。两年前儿子把暑期计划表交给他，请他只画圈，别动笔改。他学着让一张自己看得出风险的表照原样挂了整个暑假，也发现儿子自己挑的换车路线比他预想得有趣。他依然关心结果，只是现在愿意等乘车的人先把故事讲完。

        有人说一个消息已经传到，他会顺手在纸上写下发送、接收、理解三个词，看看目前能填到哪一格。若另外一个人能复述收到的具体字眼，他肯让这比一个空签名有更大分量；若那人只是答「应该收到了」，他会追着问依据。他在多数意见面前有一点顽固，也有一点想把大家尽快送回家的急躁。开始为快点收场而妥协时，他常想起那块码头黑板，站起来去倒杯水，让自己回来以后还能认真听最后一位乘客的理由。他在铅笔盒里留着一张作废的旧月票，每当讨论只剩一串百分比，就把票翻个面，想想那一个会在雨里白等二十分钟的人具体是谁。
    - schemaVersion: 1
      kind: role
      id: juror-index
      roleType: juror
      name: 柳汀
      occupation: 地方报纸索引员
      age: 61
      personality: 柳汀看东西总是先看背面。照片背面易有日期，剪报背面有时残留一句广告词，可以用来定位印刷版次。她不爱在很多人面前抢话，听见某个词用得太满却很难忍住，尤其是「从来」和「一定」这样的词。她最怕人夸她过目不忘，因为她靠的是有问题就回去找那张纸的笨办法，而不是能把一生塞进记忆里的本领。她为自己有一份安静的工作感到幸运，却也很清楚安静常常是别人在楼下替她挡住了催稿电话的结果。因此她肯花很长时间解释索引给第一次进资料室的人听，不会用一道柜台把他们打发走。
      background: |-
        她出生在一家照相馆的阁楼，父亲习惯给每卷底片记上顾客职业，母亲却坚持记衣服颜色，两人常为一张没有领取的相片争论究竟是谁。二十多年后棚改，柳汀回去收拾负片，有位素未谋面的女士来找一张雨天的合照。父母的小本子都帮不上忙，最后是隔壁修鞋的认出了照片边缘那把缺了一角的遮阳伞。她第一次明白，搜寻取决于一开始决定保留什么，找不到索引并不能说明一个人没有来过。但若有当时留下而且能与另一套东西相合的痕迹，她也不会把所有记录一概当作靠不住的传闻。

        入报馆第三年，她把两个同音的河名合成一个词条。此后记者引用了这个词条，地方志又把记者的说法收入书里，三处来源看起来格外可靠。错误被发现时，她想先悄悄修正卡片，带她的老编辑却要求把错过的每一处下游引用都标出来。那是她做过最难堪也最有用的一张目录。她从此对三篇结构高度相似的报道很警觉，会找是谁第一次到过现场，谁只是换一种语气复述。她同样警惕用一个前科抹掉一个人的全部劳动；当年主动寄来水利图纠错的，正是后来引用过那个错误的人。

        丈夫退休后整理家谱，偏爱把祖辈写得善良勇敢，柳汀则总去找借债条和搬家簿，家里的晚饭因这件事冷掉过好几次。直到孙女问她为什么从没把外婆的笑话记下来，她才发现自己同样在选择证据，有正式纸张的事容易进入她的世界，饭桌下传了三代的故事却像没发生过。她现在留一摞空白卡，请亲戚写下不敢确定的记忆，不把它们和能查实的东西装进同一格，也绝不随手丢掉。她愿意听一个人说明为什么当初不敢讲，有时坦白迟到本身也能解释为什么早先的记录只写了一半。

        在会议上她往往做最后那个说「让我找一下原句」的人，别人受不了她的慢，她自己也受不了没有终点的怀疑。只要几件来源独立的事在时间上接得起来，她很愿意当场说这已经够了。她的一个小小弱点是会喜欢字迹好看的人；为防这点影响判断，她常先把内容念出来，请旁人复述，再打开原纸看。有人想以她当过资料员为由请她代大家决定可信度，她会把笔帽扣上，请那个人也讲一句自己能核对的理由。她认为这比向专业致敬更尊重大家坐在同一张桌子旁的时间。卡片的一角她总是留白，给下一位发现不同线索的人一个可以接着写下去的位置。
    - schemaVersion: 1
      kind: role
      id: juror-ladle
      roleType: juror
      name: 何棠
      occupation: 食堂领班
      age: 49
      personality: 何棠很会分菜，一锅给八十个人吃的面，她凭第一勺的重量就知道最后三碗会不会见底。她不因此自信到相信所有第一眼的判断。厨师眼里的「够」，排在队尾的学徒眼里可能是盘子上剩的两片葱。她开朗，擅长把吵得厉害的人分派到同一张洗菜桌前干活；在她看来，人一边择豆角一边说出来的话，往往比站着对峙时更接近想说的。她也很要面子，有时会在应该认错的时候先讲一个笑话。若对方不笑而是等着，她反倒容易老实交代刚才忘了什么。这份对尴尬的了解使她不轻易把一个证人的迟疑叫作心虚。
      background: |-
        她的童年在母亲开的豆腐铺后门度过，从小被派去给不方便下楼的邻居送汤。四楼一位老裁缝从不开门，只让她把碗搁在脚垫边。她回家说送到了，一直说了整个冬天，春天才得知每次把碗拿进去的都是隔壁小孩，两人分着喝。她最先的反应是觉得被人骗了，母亲却带她去问老裁缝是不是每晚真有热汤喝。知道有，她才释然。这段事让她既在意某项服务究竟有没有送到，又不急着把登记之外的人都当成占便宜的人。程序有它保护人的作用，偶尔也会把事情中最有人情味的一截藏起来。

        她年轻时在宾馆灶间做了七年，第一次升领班便遇到婚宴临时换厅。前台在两扇门上都贴了纸，仍有十来个亲戚在旧厅坐了一个钟头。经理要求她写检讨，她气冲冲地把布告照片贴了满纸，直到看见一位客人的拐杖靠在门内：人从进门到坐下根本不会回头读背对着自己的纸。她此后处理临时安排，总让一位没参与布置的人从入口走一次。几年以后她同样为一个领班讲过公道话，那人已安排口头领路，屋里有人坚称没人提醒，原来他在接电话。两段经验都是真的，所以她最不喜欢听到「那种事我见得多了」就算讨论结束。

        何棠和哥哥共同照顾过外婆，哥哥负责买药记账，她管每日三顿。外婆过世后亲戚按账本算谁更辛苦，她一怒把冰箱上贴着的小纸条都扯了下来。事后哥哥给她寄来一叠自己留的菜单，每张都标着外婆吃了多少。她才意识到自己一边憎恶别人用文书衡量关心，一边根本没看见哥哥也做了很多无从入账的事。她现在更能听得进安静的人说自己究竟做了什么，也更不肯接受用「我是为大家好」来代替对一件具体事情的交代。

        她每周教两个邻居的孩子炒蛋，第一次总让他们自己决定什么时候起锅，再把两盘放在一起尝。她也这样对待别人的推断：先让它走到底，再问成品里哪一样东西真是那步操作带来的。评议时她愿意第一个开口，因为怕大家饿着肚子干坐，但只要旁人提出一件被她漏掉的小事，她会把刚才自己的整套说法停下来，重新从队尾那个看不见灶台的人讲起。她觉得改口并不会让最初诚实说话的人少一分尊严，硬撑到所有人都得陪笑才会。她最得意的学徒曾在她试菜时递来一把没放盐的汤匙，说师傅刚吃过咸菜，舌头得先缓一缓。她笑了半天，此后自己拿定主意以前也常先喝口白水。
    - schemaVersion: 1
      kind: role
      id: juror-stage
      roleType: juror
      name: 梅岫
      occupation: 手语剧团服装师
      age: 39
      personality: 梅岫随身带一小盒不同颜色的别针，家里抽屉却乱得找不到备用钥匙。她善于留意一个人准备发言前半秒的姿态，不必真的听见声音就知道对方有话。她性格外向，遇上打断别人的人会直接说请让他说完，不太会替这种直接道歉。她怕的是别人以为她肯替人争取发言机会，就一定同意接下来那段话。给反对的人留足时间与采信他的判断，在她心里是两项完全分得开的工作。她也清楚自己容易被临场好听的故事吸引，回家后重新摊开时间表，感受常会和下午坐在人群中时不一样。
      background: |-
        她家开过很小的裁缝摊，最早替父亲递粉片和划线尺，读初中的时候能单凭落在地上的碎料认出是哪位客人的裤腿。一次她把相同花纹的两条裙子拿反，一条是演出服，有暗扣，一条是丧服，不能露出亮片。她非常确定自己认得布，偏偏错在布是真的一样。父亲让她亲自上门讲清来由，把门牌和人的名字都写在纸上。她从那以后在意一个物件和一个人是如何对应上的；只说明东西在那里，往往解释不了到底被谁拿在手里。她对那些亲手把两边接起来的人会格外仔细地听。

        进入剧团是因为她会用手势告诉演员哪一片衣料还没有扣牢。第一次出外演出时字幕屏的亮度太低，工作人员站在台侧试机都说正常，坐到后排才发现白字完全融进背景墙。团里一位年轻人因此受罚，她一开始没作声，因为负责搭幕布的正是自己。过了一周她写了一封列出各人站位的说明，承认自己曾把背景换成浅色。那名年轻人的处罚被改了，她却失去了担任巡演主管的机会。她不把这事讲成英勇的告白，最让她记得的是那一周里自己每天早晨觉得过了今天就不用再提的侥幸。

        她现在住在一座没有电梯的老楼，会定期帮楼上独居的房客取订做的鞋。有人问是不是每周都去，她会先说自己约定的星期，再说哪几次临时换了人。有次房客在楼下夸她从没误过，她差点顺着接受，后来还是把两个帮忙的学生叫来了。她认为人的可靠有时恰恰表现在知道该找谁接手，而不是坚持每件事都亲自做过。不过她十分反感有人用一个团队的好心掩盖一个具体经手人的不知道；演出告示写了几点开门，不能代替门房看过这段告示。

        她最大的消遣是给旧木偶缝衣服。木偶不能说话，袖子宽一寸就会让它看起来换了性情。她把这当作提醒，人的外表、职业和练熟了的说话方式同样会替一句话添上一层别人想听的意思。因此她开会时常复述对方的原话，请他自己接下一句，而不去猜测他心里其实站在哪一边。她喜欢争论结束时留下几件还能核查的具体小事，哪怕结论很严厉也要说清凭的是什么。若全桌都用同样一个形容词说某个人，她往往会把那个词从笔记里划掉，直到有人能说出这个人在何时做过什么为止。她让每件戏衣背面留一寸可以放宽的余量，下一个穿它的人不会恰好和上一位同样高矮。这习惯也让她不愿把别人的旧评语原封不动穿在今天出场的人身上。
    - schemaVersion: 1
      kind: role
      id: juror-tide
      roleType: juror
      name: 谭野
      occupation: 海岸植物苗圃管理员
      age: 56
      personality: 谭野的脾气慢热，一天里最喜欢的时刻是开门以后还没有人问他这批苗能不能交货的十分钟。他习惯沿着花床走一个来回，两头的潮气常不一样，从中间看一眼会给出过于乐观的答案。别人把这种习惯叫谨慎，他自己明白里面还有一点怕承担承诺的怯意。他年轻时许下过太多无法兑现的保证，如今有时又会走到另一个极端，等到什么都能亲手摸一遍才肯说话。女儿会提醒他，凡事都等到开花才下判断的人，也许错过了好几个本可以救活一床苗的早晨。
      background: |-
        他原本在邮购公司的仓库打包，父亲从海边托人送来一盆快死的草，请他带给城里的亲戚。他忘在窗边，过了两周草居然活过来。亲戚笑他歪打正着，他却认真想知道那扇窗有什么不同，最后报名去上了园艺夜课。第一次考试他用漂亮的草图把整床植物都画成一样高，老师给了很低的分，说他记录的是脑里一片漂亮的绿，并没有看见最边缘那株歪了。多年以后他带徒弟，允许人画错，不允许把看不见的背面也画得像亲眼见过。对缺了一角的记录他不生气，只关心画的人愿不愿意指出那一角。

        有一年沿岸复植工程向他的苗圃订了一整车幼苗，周末突遇大风，送货的人把箱子临时放在背风坡。签收表整整齐齐，照片也有箱号，半个月后两处样地却连一株都没种进去。项目方认定是司机没有送达，他调出箱内浇水布的更换日期，证明确实有人养护了三天；继续追查才发现接班人按旧地图去了另一段海岸。那辆车既真实抵达，也没有完成表格让人以为已经完成的事情。他因此很看重接手之后发生的动作，也不会因为末端出了问题，就一口咬定前面所有人的说明都是互相串通。

        他和弟弟为了继承小院争执过，弟弟想铺砖让母亲走路稳当，他想保住墙边一株老石榴。两个人都对亲戚说对方自私，直到母亲自己拿一根粉笔沿院子画出平时真正走的那条路。他们最终铺了一条弯路，把树留了下来，也发现母亲根本不喜欢两人替她决定什么叫安全。谭野此后很讨厌讨论中有人替一个没有到场的人虚构心思。不过他并不天真地以为人的内心永远无法判断；看见不同的人分别带来了砖、粉笔和锯子，谁想做什么已经有了很具体的线索，仍须问清那些工具是在画线前还是画线后拿来的。

        他爱在下工后听别人讲种植失败的经过，特别喜欢能把犹豫说得具体的人。若有人只说我尽了最大努力，他会请对方讲那天先去了哪一行苗床；若有人说我亲眼看见，他会问那天站在朝水的一头还是朝路的一头。他担心自己的类比让别人的事变成了又一床植物，因而每当想说「这我懂」时先做一个很简单的动作，把手从口袋里拿出来，平放到桌上。这个动作给他留出一点空间，去听完全超出自己过往经验的回答。最近他把最靠海的一排苗交给新来的徒弟独立照看，只要求每天留下两句当天观察。一个月后两人交换笔记，竟各有一半的变化是另一个人从没留意到的。
    - schemaVersion: 1
      kind: role
      id: juror-sound
      roleType: juror
      name: 于真
      occupation: 乐器行估价员
      age: 42
      personality: 于真会听出一架旧钢琴左边第二根踏板的响声，转身却能忘记刚刚介绍给她的人的姓。她对这种不对称毫不讳言，介绍自己时会附送一支铅笔，让新朋友在她的本子上签名。她有点好胜，尤其喜欢有人拿两件看似相同的东西让她说出差别；也特别怕这种游戏变成某人在众目睽睽之下出丑的安排。她总把猜测写在折起的纸条里，双方先各自听完再打开。若有人对她说一位说话人听起来不像说谎，她能理解那种直觉，却会请大家先把声音轻重与所说内容分开谈一次。
      background: |-
        她生在一个不大喜欢音乐的家庭，父母在菜市场的柜台隔街相望，两家人的声音都大得足以穿过倒货的走廊。她最早借来学的乐器是一把少了弦的琴，邻居每天晚上来催她停下，她曾经认为那个人只是生性刻薄。后来楼上换了租客，她才知道那位邻居连夜上班，回家睡的正好是她练琴的两个钟头。她给他录了一盘自己能从头拉完的曲子，约好什么时候能练，没过多久他反成了最爱探头问她今天进度的人。她至今不喜欢听人说意见有冲突就必然有人怀着坏心，也知道解释冲突的理由不能单凭善意猜出来。

        乐器行有一次受托估算几架旧琴，卖家带来一份十年前的音乐会节目单，声称台上那架大琴就是眼前这架。漆面、厂标、照片中剥落的琴腿，连一直给琴调音的师傅都对得上。她差点报出收藏价，拆下谱架才见里面标着另一个出厂号。继续问，才知道音乐会前搬运工临时换过琴，演出照是真，调音师也确实来过，却是在上午换琴以前。她没有因此失去对老师傅的敬重，那张关于上午的旧工单反而是查清整个经过的钥匙。她从这件事得到的不是逢事怀疑，而是每一项见证都应当留在它所属的那个时刻。

        她跟合伙人有过几年不联系的日子，起因是她擅自替一位老客户延长寄卖期限。那是好心，她以为合伙人回来以后自然同意，于是对客户说已经商量过。后来东西照卖，人人都拿到了钱，合伙人却很久没有原谅她。她年轻时想不通为什么结果正确还要计较那句话，现在每次把别人的决定转达出去，都要分清是对方已经点头还是自己估计他会点头。她也有同样严格要求别人交代的毛病，朋友抱怨她有时像在给一段闲谈做估价，她会笑着收起笔，自己去煮咖啡。

        她平时愿意讲笑话，遇到一屋子人一齐笑一个人的口音或者迟疑，却会突然沉下脸来。她希望严肃的判断能够容下一些不体面的真话，比如当时没仔细看，比如怕失去奖金，比如确实喜欢那个递东西的人。说出这些不自动换来宽恕，但能帮助听者确定一项判断到底有多少把握。若她发现自己因为欣赏某个证人的坦率而把他没说的事情也算成他说过，会把笔记往旁人那边推一点，请对方替她找出原句。这个做法常让她失去一些漂亮的论点，她并不总是很高兴，却坚持用了许多年。当她自己坐在被提问的位置，也希望别人给她一次把太肯定的措辞收回来的机会。
    - schemaVersion: 1
      kind: role
      id: juror-parcel
      roleType: juror
      name: 方荻
      occupation: 生鲜合作社收货员
      age: 37
      personality: 方荻有种让人愿意跟她排同一班的可靠。她能记住同事的孩子哪天演节目，也能在深夜因为只差一筐菜拒绝在整车单上勾核。她自己看这两件事没有冲突，能够把私人照应与公事的边界讲明，别人才敢放心托人。她不爱做台上的发言者，坐在桌边却很会给互相不顺眼的两人找一个都肯接受的起点。她有时过分相信别人愿意承认自己的错误，给第二次机会时没想好第三次该怎么办。别人如果拿这一点笑她好骗，她会把下次核验的办法摆出来，却不会故意对所有人冷脸来证明清醒。
      background: |-
        她成年后的第一份工作是在长途车站卖水果，清晨来的顾客有的只要两个苹果，有的要给整车人带礼物。一次她替一个没带够钱的青年留下一箱梨，青年后来没回来，她怪对方失信了整整一周。等车站移走广告牌她才发现从进站那头再也看不见原来写有她名字的小摊。那人究竟为何没回来她永远不会知道，小时候听说的很多关于人不守信的故事第一次变得不那么斩钉截铁。她之后在合作社负责验收，总要求晚到的人描述走过哪扇门；并不是预定迟到有理，而是先确定他们其实约在同一个地方。

        她在生鲜小组发起过「坏果照样报」的约定，年初没人愿意执行，担心合作农户少拿钱。直到一批桃子因怕丢面子而瞒了磕碰，第二天整箱坏掉，损失要由所有社员分担。为了挽回信任，她挨个解释报出损坏和决定谁来赔是两道不同手续。她还亲手收过一车货，照片上箱数全对，外层品相也好，最底下却藏着别人临时塞进来的旧周转筐。称重的同事当天指出货轻，她当着众人回了一句「我自己点的还能错」。这句话现在还写在更衣柜门后，提醒她不要把我做过这件事当成我看清了一切的证据。

        她家祖母会在正月里给每个孩子寄一袋芝麻糖，纸包上不写名字，靠绳结辨认。祖母搬去和舅舅住以后，有两年都是舅舅照样打结、照样寄糖，却没向孩子们解释。她知道真相时先是难过，觉得大家竟糊弄自己，后来才想到糖包并没有声称是谁亲手做的，这个意思是自己添上去的。如今桌面上有一张字条写着「就这张纸上究竟怎么说」，她会用它提醒开会时那个总喜欢替对方添半句好意的自己，也提醒那个遇到坏结果便想把每一道手续都说成骗人的自己。

        最近她试着把仓库的会议主持交给新人。新人常把「大家都知道」挂在嘴上，她并不立即打断，等他讲完才请一个刚调来的人复述，往往能把传达上的空缺找出来。轮到自己听别人讲事情，她先关心有没有一个能让大家核对的起点，其次是有哪些证人只是在重复同一条消息。她有勇气在表决快结束时重新举手，也有勇气在被说服后承认刚才浪费了别人五分钟。她尤其想听那些觉得自己白跑一趟的人怎么讲，因为一个安排对一部分人奏效，并不能替另外一部分人的经历作证。于是她散会前总把库房的侧门也走一遍，听听守在另一头的人今天还有没有别的话要带给她。
    - schemaVersion: 1
      kind: role
      id: juror-letter
      roleType: juror
      name: 郑蓉
      occupation: 退休乡校代课教师
      age: 68
      personality: 郑蓉写字习惯特别用力，字迹能透过三层备课纸。教过她的孩子认得这种压痕，没写名字也能猜是哪位老师的批注。她很看重人能否把一句复杂的话讲给第一次听的人明白，却讨厌简单到抹掉例外的口号。她看起来温和，若听见有人用「这还用说吗」打断另一人，会把手上一切放下来请他说完。她也懂得过于在意弱势的一方可能让自己预先站队，因此在评成绩和开家长会之前，总是回过头来看一眼把两个人的位置互换以后，那句话她还能不能同样理直气壮地说出口。
      background: |-
        她上学那年父亲常年在外跑运输，家里只有祖母能给她的联络簿签名。祖母不认字，只会在横线上摁一个小小的蓝指印。有人怀疑是孩子自己摁的，老师让她带家长来校，她在校门口等到天快黑也没看见人。第二天才知道祖母一直坐在村公所旧日用来上课的房间里，以为那就是见老师的地方。那位老师后来亲自上门说明，给祖母新画了一张路线图，郑蓉才下决心以后也要当能把一桩误会走完全程的人。她至今记得那张图画了晒谷场和水井，却没把任何人画成故意走错路的傻子。

        她做代课教师时曾兼收班费，收条总放在铁皮饼干盒里。一回统计少了一份，她相信一个平常爱编故事的孩子还没有交，没公开点名，却当着他的面把盒子重新数了三遍。周末她在另一个班的本子里找到了夹错的收条，去家访时才知道孩子已经偷偷想办法向邻居借钱。她没有资格要求孩子马上原谅自己，后来一直用不同颜色的盒子收两班费用，并在每次收费后让孩子自己对着存根复读一遍数字。她知道对人的熟悉有时能帮助听懂，有时却像在纸下垫了一张用过的复写纸，把以前的过错印到了今天上面。

        她退休后和妹妹轮流替村里的老人读信。有的信希望她解释语气，有的只要她原样念，她总会先问一句。曾有位老人为着信里的「下月回来」摆了一桌菜，等到月末也没人到，大家很生气；后来发现那是三个月以前才寄出的上一封信。郑蓉没有把这件事演绎成关于通讯的不信任，反而更珍惜信封上的日期。她也会注意读信的那个人有没有机会看见日期，有时候信息在一处确凿地存在，同一个时刻另一处的人仍然可能真不知道。

        她有些老派，喜欢别人说完整句子，不太理解年轻人用一个表情代替解释。她最小的外孙教会她，有时一个表情只意味着已经看到，未必意味着应允，她便开始在手机上逐条问家里人那些图是什么心情。她的固执大半来自怕误解人，小半来自喜欢当那个解释事情的人。若有人指出她把自身的故事说得太久，她肯把话筒交出去，但希望下一个人也讲清自己所依据的那句原话。她对公正的想象接近给每个孩子读卷子：先遮住名字，看卷上留下的东西，到了需要了解条件时，再请写字的人亲口说说当天用的是哪张桌子。她至今舍不得扔掉那支短短的红铅笔，用它标过错，也用它给后来找回来的答案画过圈。
    - schemaVersion: 1
      kind: role
      id: juror-frame
      roleType: juror
      name: 费朗
      occupation: 巡回画展装裱师
      age: 45
      personality: 费朗说话常留一个短短的停顿，像量框条时在木头边上留出一道锯缝。他少年时代沉不住气，如今这种停顿得来很不容易。他喜欢把复杂争论先摆在桌上，拿纸条标出谁对哪一部分真正有经验；若有人催他选边，他往往把桌上最不起眼的一条先拿起来。他不是永远偏向小人物，相反，他非常欣赏肯为一个具体判断签字负责的人，不论那人管的是一个钩子还是整间展厅。他最不喜欢的是明明在做自己的选择，却只会说这是大家一贯的做法，让真正的决定者从句子里消失。
      background: |-
        他在一家旅馆的地下室长大，父母给来往的画商看行李。孩子被告诫千万别碰箱子，只有一个老装裱师肯教他用耳朵听哪根木条已经裂了。学徒期师傅常让他先做背板，客人看不到，出了问题却能毁掉前面的整幅画。有次他在背板上标了「已干」，其实只是摸过靠近风口的一角。那幅画后来没有受潮，可师傅仍叫他把整个判断重新写一遍，说结果好不等于当时有资格写那两个字。他记住这句话，同时也记得师傅只罚他重写，没说他蓄意毁画。这种区分让他后来愿意承认自己的疏忽，而不是等人捉住以后把一切都抵赖掉。

        成年后他跟随巡展到过许多临时的展厅，最难忘的是一次仓库停电。主办方打开侧房继续展出六幅素描，有观众凭原票看到了全套作品，也有一车从外地赶来的人只看到贴了暂停告示的正门。报社第二天同时收到感谢信和投诉信，写信的人说得都很诚恳。他当时急着给主办方挽回名誉，在采访里说「展览照常举行」，让错过的人感到被侮辱。他后来又接受一次访问，从搬画时自己走过的路线讲起，只描述那一条路上他亲自看见的事。他没有把以往的这种经验当作其他展览也一定如此的通用钥匙，反而会特别小心，不把未询问的细节自动补进相似的故事。

        他跟父亲的感情曾因为一次典当而变得僵硬。父亲卖了一把他说好留给儿子的刨子，没有事先通知。他觉得那意味着父亲从不把承诺当回事，十几年不肯再进地下室。直到翻修房子，看见父亲一直在为他收集不同尺寸的旧刨刀，他才肯问清当年的钱去了哪里。答案没有传说那么悲壮，不过是房租在那个星期到期。两个人直到今天也没有完全同意当年应该怎么做，但能够在同一张工作台上干活。费朗从此对「动机只可能有一个」这种说法心存疑虑，却不愿把无穷的可能都算成同样有分量的解释。

        他喜欢造缩尺模型，不求精细到每一块砖，只用纸板标出门窗与视线。开会时一个人说我能看清，他偶尔会用手边的水杯摆位置；摆出结果与他说的不同时，费朗先问是杯子摆错了还是当时站的位置与现在记得不同。他有时会把解决实际问题的兴趣带进不适合动手的场合，惹得旁人觉得他总想当指挥。妻子给他定了个简单规矩，先问对方愿不愿意把东西摆出来。轮到他自己在桌边判断，他也希望有人先问，再动他已经摆好的杯子。
